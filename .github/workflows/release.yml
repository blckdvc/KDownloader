name: Release

# Build KDownloader on macOS, Windows and Linux and publish a draft GitHub Release
# with the .dmg/.app, the Windows installer, the .deb and .AppImage, and the macOS
# local-signing helper script attached. Trigger by pushing a version
# tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run it manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is an Apple Silicon (arm64) runner.
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libxdo-dev libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Frontend is plain static files in ui/ (no npm build step needed).
      - name: Build app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KDownloader ${{ github.ref_name }}"
          releaseBody: |
            ### Install on Windows
            Run `KDownloader_…_x64-setup.exe`.

            ### Install on Linux
            Install the `.deb` (Debian, Ubuntu), or make the `.AppImage` executable and run it.
            ZIP and 7z extraction needs `bsdtar` (package `libarchive-tools`), which the `.deb` installs.

            ### Install on macOS
            1. Mount the `.dmg` and drag **KDownloader** to Applications.
            2. Download `kdownloader-macos-sign.command` (attached below) and run it once:
               `./kdownloader-macos-sign.command`
               This locally signs the app so macOS lets it use the local network
               (needed for automatic UPnP port-forwarding). See the README for why.
            3. Launch KDownloader, then allow it under
               System Settings → Privacy & Security → Local Network.
          releaseDraft: true
          prerelease: false

      - name: Attach the macOS signing script
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            scripts/kdownloader-macos-sign.command --clobber
