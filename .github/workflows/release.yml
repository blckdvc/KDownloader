name: Release

# Build KDownloader on macOS, Windows and Linux and fill a draft GitHub Release
# with the .dmg/.app, the Windows installer, the .deb and .AppImage, and the macOS
# local-signing helper script attached. Trigger by pushing a version
# tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or run it manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for the three builds. When each build made its own, two that
  # started together ended up with a draft each.
  draft:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release, or reuse the one this tag has
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty"
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            # Take the id from the answer: the list doesn't show a new draft at once.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="KDownloader $TAG" -F draft=true \
              -F body=@.github/release-body.md --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is an Apple Silicon (arm64) runner.
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libxdo-dev libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Frontend is plain static files in ui/ (no npm build step needed).
      - name: Build app + upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages that the app's updater installs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The draft made by the job above: the three builds upload to it.
          releaseId: ${{ needs.draft.outputs.id }}
          # Not to create a release, since releaseId is set: the update
          # addresses in latest.json are built from it.
          tagName: ${{ github.ref_name }}

      - name: Attach the macOS signing script
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            scripts/kdownloader-macos-sign.command --clobber
