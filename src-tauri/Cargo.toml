[package]
name = "kdownloader"
version = "0.3.0"
description = "A light, complete BitTorrent client"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kdownloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
trash = "5"
unrar = "0.5"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
librqbit = { path = "vendor/rqbit/crates/librqbit", features = ["tracing-subscriber-utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "charset", "http2"] }
roxmltree = "0.20"
regex = "1"
percent-encoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
ctr = "0.9"
base64 = "0.22"
libc = "0.2"
arboard = { version = "3", default-features = false }
# The macOS Keychain, Windows Credential Manager, and the Secret Service on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tracing = "0.1"
maxminddb = { version = "0.32", features = ["mmap"] }
flate2 = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The transfer path: RC4 is generic, so it compiles inside librqbit.
[profile.release.package.librqbit]
opt-level = 3

[profile.release.package.rc4]
opt-level = 3

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSObject", "NSGeometry", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSDockTile", "NSPasteboard", "NSImage", "NSImageView", "NSControl", "NSView", "NSColor", "NSFont", "NSGraphics", "NSStringDrawing", "NSAttributedString", "NSCell", "NSBezierPath"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
